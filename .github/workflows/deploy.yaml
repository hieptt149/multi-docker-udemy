name: Deploy MultiDocker
on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t hieptt149/multi-docker-client-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true -p hieptt149/multi-docker-client-test npm test

      - run: docker build -t hieptt149/multi-docker-client ./client
      - run: docker build -t hieptt149/multi-docker-server ./server
      - run: docker build -t hieptt149/multi-docker-worker ./worker
      - run: docker build -t hieptt149/multi-docker-nginx ./nginx

      - run: docker push hieptt149/multi-docker-client
      - run: docker push hieptt149/multi-docker-server
      - run: docker push hieptt149/multi-docker-worker
      - run: docker push hieptt149/multi-docker-nginx

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to EBS
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          existing_bucket_name: multi-docker-bucket
          region: ap-southeast-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
