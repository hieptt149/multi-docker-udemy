name: Deploy MultiDocker
on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Build client with dev Dockerfile for testing
      - name: Build client (test)
        run: docker build -t hieptt149/multi-docker-client-test -f ./client/Dockerfile.dev ./client

      # Run tests
      - name: Run client tests
        run: docker run -e CI=true hieptt149/multi-docker-client-test npm test

      # Build production images
      - name: Build client (prod)
        run: docker build -t hieptt149/multi-docker-client ./client

      - name: Build server
        run: docker build -t hieptt149/multi-docker-server ./server

      - name: Build worker
        run: docker build -t hieptt149/multi-docker-worker ./worker

      - name: Build nginx
        run: docker build -t hieptt149/multi-docker-nginx ./nginx

      # Push images
      - name: Push client
        run: docker push hieptt149/multi-docker-client

      - name: Push server
        run: docker push hieptt149/multi-docker-server

      - name: Push worker
        run: docker push hieptt149/multi-docker-worker

      - name: Push nginx
        run: docker push hieptt149/multi-docker-nginx

